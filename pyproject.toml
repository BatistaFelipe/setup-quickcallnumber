[project]
name = "setup-quickcallnumber"
version = "1.1.0"
dependencies = [
    "python-dotenv",
    "requests",
    "defusedxml",
]
requires-python = ">=3.8"
authors = [{ name = "Felipe Batista", email = "contato@felipebatista.dev" }]
description = "Automation to update quick call number in intercom using API."
readme = "README.md"
license = "MIT"
keywords = ["automation", "intercom", "voip", "sip"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "requests-mock",
    "ruff",
    "black",
    "bandit",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["integration: hits real intercom device"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.scripts]
setup-intercom = "src.main:main"
